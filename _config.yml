# Site settings
title: "Rawka Agrawal & Company"
email: "sandeepgarg.fca@gmail.com"
description: >- 
  Established in 1979, providing comprehensive financial, audit, and tax advisory services.
twitter_username: 
github_username: sanyamsgarg-bot
minimal_mistakes_skin: contrast
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 5 
paginate_path: /page:num/
timezone: Asia/Kolkata

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Rawka Agrawal & Company"
  avatar : "/logo.png"
  bio    : "401, Chetak Centre, 12/2 RNT Marg, Indore 452001 <br> Phone: +91 98262 97313"
  links:
    - label: "Email Us"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:sandeepgarg.fca@gmail.com"
    - label: "Contact Form"
      icon: "fas fa-fw fa-link"
      url: "/contact/"

footer:
  links:
    - label: "sandeepgarg.fca@gmail.com"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:sandeepgarg.fca@gmail.com"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
